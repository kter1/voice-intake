name: gitleaks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Minimum permissions - the scan only needs to read repo contents.
permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest

    env:
      # Pin to the version verified locally. Update intentionally, not via `latest`.
      GITLEAKS_VERSION: 8.30.1

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # required for history-aware scan

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          # -f makes curl fail on HTTP errors instead of piping HTML into tar.
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks

      - name: Verify Gitleaks install
        run: |
          command -v gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks git --redact --verbose
