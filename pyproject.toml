[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-intake"
version = "0.2.0"
description = "Supervised AI voice intake system for healthcare."
license = {text = "MIT"}
authors = [{name = "kter1"}]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pypdf>=3.0",
    "python-docx>=1.1",
    "httpx>=0.27",

    "python-multipart>=0.0.9",
    "deepgram-sdk>=3.0",
    "websockets>=13.0",
    "twilio>=9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "google-cloud-speech>=2.27",
]

[tool.setuptools.packages.find]
where = ["src"]

